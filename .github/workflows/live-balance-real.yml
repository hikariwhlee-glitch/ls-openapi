name: live-balance-real (실전 계좌 잔고 조회, 수동 실행)

# 실전 계좌 잔고 조회(CFOAQ50600) 한 건만 실행합니다. 주문·시세 테스트는 실행하지 않습니다.
# 실전 키는 모의투자 키와 분리해 `live-real` 환경(Settings > Environments)의 시크릿으로만 등록하세요.
# 환경에 Required reviewers 와 배포 가능 브랜치 제한을 걸어 두기를 권장합니다.
# 저장소가 공개라 로그도 공개됩니다. 테스트는 계좌·잔고 값을 출력하지 않고 응답코드와 필드 이름만 출력합니다.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "실전 계좌를 조회합니다. 진행하려면 REAL 을 입력하세요"
        required: true

permissions:
  contents: read

jobs:
  balance-real:
    if: ${{ inputs.confirm == 'REAL' }}
    runs-on: ubuntu-latest
    environment: live-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 실전 잔고 조회 (CFOAQ50600)
        env:
          LS_LIVE_TEST: "1"
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
        run: pytest -s -v tests/live/test_live_account.py
