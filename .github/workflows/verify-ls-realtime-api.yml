name: Verify LS simulated futures realtime WebSocket

on:
  workflow_dispatch:
    inputs:
      futures_code:
        description: "LS domestic index futures short code"
        type: string
        required: true
        default: "A0173000"
      duration_seconds:
        description: "How long to wait for live messages (5-60 seconds)"
        type: string
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  realtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Subscribe to simulated futures trade and order-book feeds
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_WS_FUTURES_CODE: ${{ inputs.futures_code }}
          LS_WS_DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: python scripts/smoke_test_realtime_api.py
