name: Verify LS futures symbol master

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Instrument name or code to search"
        required: true
        type: string
        default: "코스피200 선물"

permissions:
  contents: read

jobs:
  futures-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Search futures master (read-only)
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_INSTRUMENT_QUERY: ${{ inputs.query }}
        run: python scripts/smoke_test_instrument_search.py
