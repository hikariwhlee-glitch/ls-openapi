name: Verify LS paper futures order lifecycle

on:
  workflow_dispatch:
    inputs:
      confirm_paper_order:
        description: "Type I_ACKNOWLEDGE_PAPER_SIMULATED_TRADING to submit one simulated sell-to-close contract"
        type: string
        required: true
        default: ""
      target_code:
        description: "Held index futures code to close by one contract"
        type: string
        required: true
        default: "A016C000"

permissions:
  contents: read

concurrency:
  group: ls-paper-order-lifecycle
  cancel-in-progress: false

jobs:
  paper-order-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Verify one-contract paper order lifecycle
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_ORDER_CONFIRM: ${{ inputs.confirm_paper_order }}
          LS_ORDER_TARGET_CODE: ${{ inputs.target_code }}
        run: python scripts/verify_paper_order_api.py

