name: Verify LS read-only API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Query futures market data (read-only)
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
        run: python scripts/smoke_test_read_api.py
      - name: Query futures account balance (read-only, redacted)
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
        run: python scripts/smoke_test_account_read_api.py
