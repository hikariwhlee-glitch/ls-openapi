name: Verify LS simulated KOSPI 200 options realtime WebSocket

on:
  workflow_dispatch:
    inputs:
      option_code:
        description: "Optional LS KOSPI 200 option short code; blank selects from the current t8433 master"
        type: string
        required: false
        default: ""
      duration_seconds:
        description: "How long to wait for live messages (5-60 seconds)"
        type: string
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  realtime-options-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Subscribe to simulated KOSPI 200 options feeds
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_WS_OPTION_CODE: ${{ inputs.option_code }}
          LS_WS_DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: python scripts/smoke_test_realtime_options.py
