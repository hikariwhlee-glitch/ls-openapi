name: live-auth-test (수동 실행)

# 앱키/시크릿키가 필요한 실서버 테스트입니다.
# 자동 실행(push, pull_request)에는 연결하지 않고, Actions 탭에서 직접 실행할 때만 동작합니다.
on:
  workflow_dispatch:
    inputs:
      run_sample_sim_order:
        description: "모의투자 계좌에 제공된 샘플 주문 1건(101T9000, 수량 5)을 전송"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-auth:
    runs-on: ubuntu-latest
    # Settings > Environments 에서 live-test 환경을 만들고 Required reviewers 를 지정하면
    # 실행 전에 승인을 받습니다. 시크릿은 저장소 시크릿이나 환경 시크릿 어느 쪽에 넣어도 됩니다.
    environment: live-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 실서버 테스트 (인증·시세 및 명시적으로 선택한 모의투자 주문)
        env:
          LS_LIVE_TEST: "1"
          LS_LIVE_ORDER_TEST: ${{ inputs.run_sample_sim_order && '1' || '0' }}
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          # 선택: Settings > Variables 에 LS_BASE_URL 을 등록하면 REST 주소를 바꿀 수 있습니다.
          LS_BASE_URL: ${{ vars.LS_BASE_URL }}
          # t2111 시세 조회 테스트용 종목코드. Settings > Variables 에 LS_FOCODE 를 등록하세요.
          LS_FOCODE: ${{ vars.LS_FOCODE }}
        run: pytest -s -v tests/live
