name: live-test (수동 실행)

# 앱키/시크릿키가 필요한 실서버 테스트입니다.
# 자동 실행(push, pull_request)에는 연결하지 않고, Actions 탭에서 직접 실행할 때만 동작합니다.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "실행할 실서버 테스트"
        type: choice
        required: true
        default: balance
        options:
          - balance
          - market_data
          - orders

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    # Settings > Environments 에서 live-test 환경을 만들고 Required reviewers 를 지정하면
    # 실행 전에 승인을 받습니다. 시크릿은 저장소 시크릿이나 환경 시크릿 어느 쪽에 넣어도 됩니다.
    environment: live-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: pip install -e ".[dev]"

      - name: 선택한 실서버 테스트 실행
        env:
          LS_LIVE_TEST: "1"
          LS_BALANCE_LIVE_TEST: ${{ inputs.suite == 'balance' && '1' || '' }}
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
          LS_BASE_URL: ${{ vars.LS_BASE_URL }}
          LS_FOCODE: ${{ vars.LS_FOCODE }}
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            balance)
              pytest -s -v tests/live/test_live_balance.py
              ;;
            market_data)
              pytest -s -v tests/live/test_live_futures.py
              ;;
            orders)
              pytest -s -v tests/live/test_live_order.py
              ;;
            *)
              echo "Unknown test suite" >&2
              exit 2
              ;;
          esac
