[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-openapi"
version = "0.1.0"
description = "Domestic futures and options backtesting tools for LS Securities Open API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]
