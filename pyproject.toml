[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-openapi"
version = "0.1.0"
description = "LS증권 OPEN API 비공식 Python 샘플 (인증, 국내선물 시세와 명시적 주문 요청)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]
